plugins {
    id 'com.android.application'
}

android {
    namespace 'de.wallura.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.wallura.app'
        minSdk 24
        targetSdk 34
        versionCode 10600
        versionName '1.6.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
