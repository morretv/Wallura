plugins {
    id 'com.android.application'
}

android {
    namespace 'de.wallura.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.wallura.app'
        minSdk 24
        targetSdk 34
        versionCode 20200
        versionName '2.2.0'
    }

    // Fester Signaturschlüssel im Projekt: jede APK hat dieselbe Signatur.
    // Mit dem zufälligen Debug-Schlüssel der CI war jeder Build anders signiert –
    // Android verweigerte dann Installation/Update mit „App nicht installiert“.
    signingConfigs {
        release {
            storeFile rootProject.file('wallura-release.jks')
            storePassword 'WalluraRelease2026'
            keyAlias 'wallura'
            keyPassword 'WalluraRelease2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // Auch Testbauten mit demselben Schlüssel signieren, damit sie sich
            // gegenseitig und über die Release-APK installieren lassen.
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
