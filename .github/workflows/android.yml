name: Android APK

# APK bauen: automatisch bei jedem Tag (wird an das Release gehängt),
# oder manuell über "Run workflow" (dann nur als Artifact zum Download).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$VER"
          MA=${MA%%[!0-9]*}; MI=${MI%%[!0-9]*}; PA=${PA%%[!0-9]*}
          CODE=$(( ${MA:-1} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          sed -i "s/^\( *\)versionCode .*/\1versionCode $CODE/" app/build.gradle
          sed -i "s/^\( *\)versionName .*/\1versionName '$VER'/" app/build.gradle
          grep -E "version(Code|Name)" app/build.gradle

      - name: APK bauen
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: APK bereitstellen und Signatur prüfen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Wallura.apk
          ls -l Wallura.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Wallura.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wallura-apk
          path: Wallura.apk

      - name: APK an das Release hängen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Das Windows-Release wird vom Release-Workflow erstellt – kurz darauf warten.
          for i in $(seq 1 40); do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" Wallura.apk --clobber
              echo "Wallura.apk am Release $GITHUB_REF_NAME."
              exit 0
            fi
            echo "Warte auf das Release $GITHUB_REF_NAME ($i/40) …"
            sleep 10
          done
          echo "Release $GITHUB_REF_NAME wurde nicht erstellt – Windows-Build prüfen." >&2
          exit 1
