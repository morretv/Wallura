name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version aus dem Tag übernehmen
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$VER\"/" wallura.py
          echo "APPVER=$VER" >> "$GITHUB_ENV"

      - name: Wallura.exe bauen
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python make_icon.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Wallura --icon wallura.ico --collect-all customtkinter --hidden-import pystray._win32 wallura.py

      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress

      - name: Installer bauen
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=$env:APPVER" Wallura.iss'

      - uses: softprops/action-gh-release@v2
        with:
          files: installer/Wallura-Setup.exe
